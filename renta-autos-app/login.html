
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Renta de Autos</title>

    <!-- Estilos del nuevo portal -->
    <link rel="stylesheet" href="css/portal.css">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="login-page">

    <main class="login-layout">

        <!-- PANEL IZQUIERDO: IMAGEN Y PRESENTACIÓN -->
        <section class="login-visual">

            <img
                src="assets/Imagenes/Carros/fondo.jpg"
                alt="BMW disponible para renta"
                class="login-car-image"
            >

            <div class="login-visual-overlay">
                <h1>Tu próxima aventura comienza aquí</h1>
                <p>
                    Encuentra el vehículo ideal y disfruta
                    cada kilómetro de tu viaje.

                </p>

                <div class="login-benefits">
                     <div class="login-benefit">
                        <i class="fa-solid fa-car"></i>
                        <span>Gran variedad<br>de vehículos</span>
                </div>

                <div class="login-benefit">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Rentas seguras<br>y confiables</span>
                </div>

            </div>

            </div>
        </section>


        <!-- PANEL DERECHO: FORMULARIO -->
        <section class="login-form-panel">

            <div class="login-card">

                <a href="index.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    Volver
                </a>

                <div class="logo">
                    <img
                        src="assets/Imagenes/LogoCar2.png"
                        alt="Logo Renta de Autos"
                    >
                </div>

                <h2>Iniciar Sesión</h2>

                <p class="subtitle">
                    Ingresa tus credenciales para acceder
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">
                            Correo Electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    
            <div class="form-group">
                <label for="password">
                    Contraseña
                </label>

                <div class="password-wrapper">
                    <input 
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                    <button
                         type="button"
                         id="togglePassword"
                         class="toggle-password"
                         aria-label="Mostrar contraseña"
           >
                    <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>


                    <div
                        id="authError"
                        class="error-msg"
                        role="alert"
                        aria-live="polite"
                        style="display: none;"
                    ></div>

                    <button type="submit" class="login-btn">
                        INGRESAR
                    </button>

                </form>

                <div class="login-footer">
                    <p>
                        ¿No tienes una cuenta?
                        <a href="registro.html">Regístrate aquí</a>
                    </p>
                </div>

            </div>

        </section>

    </main>

    <!-- Scripts originales -->
    <script src="js/client.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
