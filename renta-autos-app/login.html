<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Renta de Autos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-card">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Volver
        </a>
        <div class="logo">
            <img src="assets/Imagenes/LogoCar.png" alt="Logo Renta de Autos">
        </div>

        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Ingresa tus credenciales para acceder</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div id="authError" class="error-msg" style="display: none; margin-bottom: 1rem; color: #ff6b6b; font-size: 0.85rem; text-align: center;"></div>
            <button type="submit" class="login-btn">INGRESAR</button>
        </form>

        <div class="login-footer">
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </div>

    <script src="js/client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
